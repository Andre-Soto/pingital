<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
<defs>
<filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
<feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.06"/>
</filter>
</defs>

<style>
/* Embedded CSS for specific looped elements */
.progress-ring {
stroke-dasharray: 280;
animation: loadRing 3s ease-in-out infinite;
transform-origin: center;
transform: rotate(-90deg);
}
@keyframes loadRing {
0% { stroke-dashoffset: 280; }
50% { stroke-dashoffset: 60; }
100% { stroke-dashoffset: 280; }
}
.pulse-circle {
animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
transform-origin: center;
}
@keyframes pulse {
0% { transform: scale(0.8); opacity: 1; }
70% { transform: scale(2.5); opacity: 0; }
100% { transform: scale(0.8); opacity: 0; }
}
</style>

<rect width="800" height="600" rx="20" fill="#f5f5f7"/>

<rect x="40" y="40" width="720" height="520" rx="16" fill="#ffffff" filter="url(#shadow)"/>

<rect x="40" y="40" width="200" height="520" rx="16" fill="#ffffff"/>
<line x1="240" y1="40" x2="240" y2="560" stroke="#f5f5f7" stroke-width="2"/>

<rect x="64" y="72" width="24" height="24" rx="6" fill="#0071e3"/>
<text x="100" y="89" fill="#1d1d1f" font-size="16" font-weight="600">Workspace</text>

<rect x="56" y="130" width="168" height="40" rx="8" fill="#0071e3" opacity="0.08"/>
<rect x="72" y="142" width="16" height="16" rx="4" fill="#0071e3"/>
<rect x="100" y="146" width="70" height="8" rx="4" fill="#0071e3"/>

<g fill="#e8e8ed">
<rect x="72" y="194" width="16" height="16" rx="4"/>
<rect x="100" y="198" width="60" height="8" rx="4"/>
<rect x="72" y="246" width="16" height="16" rx="4"/>
<rect x="100" y="250" width="80" height="8" rx="4"/>
<rect x="72" y="298" width="16" height="16" rx="4"/>
<rect x="100" y="302" width="50" height="8" rx="4"/>
</g>

<text x="280" y="96" fill="#1d1d1f" font-size="28" font-weight="600">Overview</text>
<circle cx="716" cy="86" r="18" fill="#d2d2d7"/>

<rect x="280" y="130" width="220" height="160" rx="16" fill="#ffffff" stroke="#f5f5f7" stroke-width="2"/>
<text x="300" y="165" fill="#86868b" font-size="12" font-weight="600" letter-spacing="1">REVENUE</text>
<text x="300" y="210" fill="#1d1d1f" font-size="32" font-weight="600" letter-spacing="-1">$45.2k</text>
<rect x="300" y="235" width="60" height="24" rx="12" fill="#34c759" opacity="0.15"/>
<text x="312" y="251" fill="#248a3d" font-size="12" font-weight="600">+14%</text>
<rect x="370" y="243" width="110" height="8" rx="4" fill="#f5f5f7"/>

<rect x="520" y="130" width="220" height="160" rx="16" fill="#ffffff" stroke="#f5f5f7" stroke-width="2"/>
<text x="540" y="165" fill="#86868b" font-size="12" font-weight="600" letter-spacing="1">CONVERSION</text>

<g transform="translate(630, 215)">
<circle cx="0" cy="0" r="40" fill="none" stroke="#f5f5f7" stroke-width="12"/>
<circle cx="0" cy="0" r="40" fill="none" stroke="#0071e3" stroke-width="12" stroke-linecap="round" class="progress-ring"/>
<text x="-18" y="6" fill="#1d1d1f" font-size="18" font-weight="600">68%</text>
</g>

<rect x="280" y="310" width="460" height="210" rx="16" fill="#ffffff" stroke="#f5f5f7" stroke-width="2"/>
<text x="300" y="345" fill="#86868b" font-size="12" font-weight="600" letter-spacing="1">USER TRAFFIC</text>

<line x1="300" y1="470" x2="710" y2="470" stroke="#f5f5f7" stroke-width="2"/>
<line x1="300" y1="410" x2="710" y2="410" stroke="#f5f5f7" stroke-width="2"/>

<rect x="330" y="430" width="36" height="40" rx="6" fill="#0071e3" opacity="0.8">
<animate attributeName="height" values="40; 100; 40" dur="4s" repeatCount="indefinite" begin="0s" />
<animate attributeName="y" values="430; 370; 430" dur="4s" repeatCount="indefinite" begin="0s" />
</rect>

<rect x="400" y="390" width="36" height="80" rx="6" fill="#0071e3" opacity="0.8">
<animate attributeName="height" values="80; 40; 80" dur="3s" repeatCount="indefinite" begin="0.5s" />
<animate attributeName="y" values="390; 430; 390" dur="3s" repeatCount="indefinite" begin="0.5s" />
</rect>

<rect x="470" y="350" width="36" height="120" rx="6" fill="#0071e3" opacity="0.8">
<animate attributeName="height" values="120; 60; 120" dur="5s" repeatCount="indefinite" begin="1s" />
<animate attributeName="y" values="350; 410; 350" dur="5s" repeatCount="indefinite" begin="1s" />
</rect>

<rect x="540" y="410" width="36" height="60" rx="6" fill="#0071e3" opacity="0.8">
<animate attributeName="height" values="60; 110; 60" dur="4s" repeatCount="indefinite" begin="1.5s" />
<animate attributeName="y" values="410; 360; 410" dur="4s" repeatCount="indefinite" begin="1.5s" />
</rect>

<rect x="610" y="320" width="36" height="150" rx="6" fill="#0071e3" opacity="0.8">
<animate attributeName="height" values="150; 90; 150" dur="4.5s" repeatCount="indefinite" begin="0.2s" />
<animate attributeName="y" values="320; 380; 320" dur="4.5s" repeatCount="indefinite" begin="0.2s" />
</rect>

<rect x="580" y="330" width="90" height="32" rx="16" fill="#ffffff" filter="url(#shadow)"/>
<circle cx="600" cy="346" r="6" fill="#34c759" class="pulse-circle"/>
<circle cx="600" cy="346" r="4" fill="#34c759"/>
<text x="616" y="351" fill="#1d1d1f" font-size="12" font-weight="600">LIVE</text>

</svg>