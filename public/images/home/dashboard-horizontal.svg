<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #e8e8ed;">
  <defs>
    <!-- Subtle macOS Window Shadow -->
    <filter id="window-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    
    <!-- Chart Area Gradient Fill -->
    <linearGradient id="chart-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0.0" />
    </linearGradient>

    <!-- Strict Clipping Path to keep the graph line inside its container -->
    <clipPath id="chart-clip">
      <rect x="60" y="110" width="560" height="250" />
    </clipPath>
  </defs>

  <style>
    .blink-cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- ==================== MAIN WINDOW ==================== -->
  <rect x="40" y="40" width="920" height="380" rx="16" fill="#ffffff" filter="url(#window-shadow)"/>

  <!-- Top Window Bar -->
  <circle cx="70" cy="65" r="6" fill="#ff5f56"/>
  <circle cx="90" cy="65" r="6" fill="#ffbd2e"/>
  <circle cx="110" cy="65" r="6" fill="#27c93f"/>
  
  <text x="140" y="70" fill="#86868b" font-size="12" font-weight="500">kinetic-core-v4.production.mesh</text>
  
  <!-- Right side header stats -->
  <circle cx="700" cy="66" r="4" fill="#ff3b30"/>
  <text x="712" y="70" fill="#1d1d1f" font-size="12" font-weight="600">12.4ms P99 Latency</text>
  <line x1="840" y1="58" x2="840" y2="74" stroke="#d2d2d7" stroke-width="1"/>
  <text x="856" y="70" fill="#86868b" font-size="12" font-weight="500">98,420 req/sec</text>

  <line x1="40" y1="90" x2="960" y2="90" stroke="#f5f5f7" stroke-width="2"/>

  <!-- ==================== LEFT PANEL: CHART ==================== -->
  <rect x="60" y="110" width="560" height="290" rx="12" fill="#f5f5f7" />
  
  <text x="80" y="145" fill="#1d1d1f" font-size="14" font-weight="600">Cluster Microservices &amp; Gateway Nodes</text>
  
  <!-- Status Pill -->
  <rect x="410" y="128" width="190" height="24" rx="12" fill="#0071e3" opacity="0.1"/>
  <text x="424" y="144" fill="#0071e3" font-size="10" font-weight="700" letter-spacing="0.5">EU-CENTRAL-1 (SYNCHRONIZED)</text>

  <!-- Animated Morphing Line Chart (Clipped directly to the panel area) -->
  <g clip-path="url(#chart-clip)">
    <g transform="translate(0, -20)">
      <path fill="url(#chart-gradient)" opacity="0.8">
        <animate attributeName="d" 
          values="M 60 320 Q 150 200, 250 260 T 450 180 T 620 280 L 620 380 L 60 380 Z;
                  M 60 320 Q 150 260, 250 200 T 450 240 T 620 200 L 620 380 L 60 380 Z;
                  M 60 320 Q 150 200, 250 260 T 450 180 T 620 280 L 620 380 L 60 380 Z" 
          dur="8s" repeatCount="indefinite" />
      </path>
      <path fill="none" stroke="#0071e3" stroke-width="3" stroke-linecap="round">
        <animate attributeName="d" 
          values="M 60 320 Q 150 200, 250 260 T 450 180 T 620 280;
                  M 60 320 Q 150 260, 250 200 T 450 240 T 620 200;
                  M 60 320 Q 150 200, 250 260 T 450 180 T 620 280" 
          dur="8s" repeatCount="indefinite" />
      </path>
    </g>
  </g>

  <!-- X-Axis Labels -->
  <text x="80" y="340" fill="#86868b" font-size="10" font-weight="500">00:00 UTC</text>
  <text x="250" y="340" fill="#86868b" font-size="10" font-weight="500">06:00 UTC</text>
  <text x="420" y="340" fill="#86868b" font-size="10" font-weight="500">12:00 UTC</text>
  
  <!-- Terminal Log Bottom -->
  <line x1="60" y1="360" x2="620" y2="360" stroke="#e8e8ed" stroke-width="1"/>
  <text x="80" y="385" fill="#1d1d1f" font-size="11" font-family="'Menlo', 'Courier New', monospace">
    <tspan fill="#0071e3">$</tspan> consensus:raft_replicate("zone-a1", payload: 0x8F9C) -> OK [2.1ms]<tspan class="blink-cursor">_</tspan>
  </text>
  <text x="548" y="385" fill="#86868b" font-size="10" font-weight="500">TLS 1.3 Strict</text>


  <!-- ==================== RIGHT PANELS ==================== -->
  
  <!-- Right Panel 1: Distributed State -->
  <rect x="640" y="110" width="300" height="135" rx="12" fill="#f5f5f7" />
  <text x="660" y="145" fill="#1d1d1f" font-size="14" font-weight="600">Distributed State</text>
  <text x="850" y="145" fill="#86868b" font-size="10" font-weight="700" letter-spacing="0.5">RAFT QUORUM</text>
  
  <text x="660" y="190" fill="#1d1d1f" font-size="36" font-weight="700" letter-spacing="-1">100.0%</text>
  <text x="660" y="210" fill="#86868b" font-size="12" font-weight="500">Replication Factor: 5 Nodes</text>
  
  <!-- Progress Bar -->
  <rect x="660" y="225" width="260" height="6" rx="3" fill="#d2d2d7" />
  <rect x="660" y="225" width="260" height="6" rx="3" fill="#0071e3">
    <animate attributeName="width" values="0; 260; 260" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Right Panel 2: Automated Test Rig -->
  <rect x="640" y="265" width="300" height="135" rx="12" fill="#f5f5f7" />
  <text x="660" y="300" fill="#1d1d1f" font-size="14" font-weight="600">Automated Test Rig</text>
  
  <!-- Checkmark Icon -->
  <g transform="translate(900, 288)" fill="none" stroke="#34c759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="M9 12l2 2 4-4"/>
  </g>

  <text x="660" y="345" fill="#1d1d1f" font-size="36" font-weight="700" letter-spacing="-1">1,492 / 1,492</text>
  <text x="660" y="365" fill="#86868b" font-size="12" font-weight="500">Integration suites passed</text>
  <text x="660" y="385" fill="#34c759" font-size="11" font-weight="600">0 regressions detected</text>

</svg>
